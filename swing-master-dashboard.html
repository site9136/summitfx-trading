<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swing Master Dashboard - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    overflow-x:hidden;
    padding:40px;
}

/* CONTAINER */

.bot-container{
    max-width:900px;
    margin:auto;
}

/* HEADER */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:20px;
}

.back-btn{
    padding:12px 20px;
    background:#111936;
    border-radius:12px;
    color:white;
    text-decoration:none;
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
}

.back-btn:hover{
    border-color:#00f7ff;
    color:#00f7ff;
}

.page-title{
    font-size:40px;
    font-weight:700;
    color:#00f7ff;
}

/* BOT CARD */

.bot-card{
    background:linear-gradient(145deg,#0d1327,#121a34);
    border-radius:30px;
    padding:40px;
    border:1px solid rgba(255,255,255,0.08);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,247,255,0.08);
}

.bot-card::before{
    content:'';
    position:absolute;
    width:220px;
    height:220px;
    background:rgba(0,247,255,0.05);
    border-radius:50%;
    top:-100px;
    right:-100px;
}

/* STATUS */

.status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:20px;
}

.bot-name{
    font-size:34px;
    font-weight:700;
}

.status{
    padding:10px 18px;
    border-radius:50px;
    font-weight:700;
    font-size:14px;
    letter-spacing:1px;
}

.running{
    background:rgba(0,255,136,0.15);
    color:#00ff88;
    border:1px solid rgba(0,255,136,0.3);
    box-shadow:0 0 20px rgba(0,255,136,0.15);
}

.paused{
    background:rgba(255,193,7,0.15);
    color:#ffc107;
    border:1px solid rgba(255,193,7,0.3);
}

.stopped{
    background:rgba(255,77,77,0.15);
    color:#ff4d4d;
    border:1px solid rgba(255,77,77,0.3);
}

/* STATS */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:35px;
}

.stat-box{
    background:#111936;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.06);
    transition:0.3s;
}

.stat-box:hover{
    transform:translateY(-5px);
    border-color:#00f7ff;
}

.stat-title{
    color:#9ca8c7;
    margin-bottom:10px;
    font-size:14px;
}

.stat-value{
    font-size:30px;
    font-weight:700;
}

.green{
    color:#00ff88;
}

.red{
    color:#ff4d4d;
}

/* CHART */

.chart-box{
    background:#111936;
    border-radius:20px;
    padding:20px;
    margin-bottom:35px;
    border:1px solid rgba(255,255,255,0.06);
}

.chart-title{
    margin-bottom:20px;
    color:#9ca8c7;
}

canvas{
    width:100%;
    height:320px;
}

/* CONTROLS */

.controls{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.control-btn{
    flex:1;
    min-width:180px;
    padding:18px;
    border:none;
    border-radius:16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.start-btn{
    background:linear-gradient(90deg,#00ff88,#00c96d);
    color:black;
}

.pause-btn{
    background:linear-gradient(90deg,#ffc107,#ff9800);
    color:black;
}

.stop-btn{
    background:linear-gradient(90deg,#ff4d4d,#ff0000);
    color:white;
}

.control-btn:hover{
    transform:translateY(-4px);
    opacity:0.9;
}

/* TRADE LOG */

.trade-log{
    margin-top:35px;
    background:#111936;
    border-radius:20px;
    padding:25px;
    border:1px solid rgba(255,255,255,0.06);
}

.trade-log h3{
    margin-bottom:20px;
}

.log-item{
    padding:14px;
    border-radius:12px;
    margin-bottom:12px;
    background:#0d1327;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

/* MOBILE */

@media(max-width:800px){

body{
    padding:20px;
}

.page-title{
    font-size:30px;
}

.bot-card{
    padding:25px;
}

.bot-name{
    font-size:28px;
}

.stat-value{
    font-size:24px;
}

.controls{
    flex-direction:column;
}

}

</style>
</head>
<body>

<div class="bot-container">

    <div class="topbar">

        <a href="swing-bot.html" class="back-btn">
            ← Back To Bot
        </a>

        <div class="page-title">
            SummitFX Bot Engine
        </div>

    </div>

    <div class="bot-card">

        <div class="status-row">

            <div class="bot-name">
                Swing Master
            </div>

            <div class="status stopped" id="botStatus">
                STOPPED
            </div>

        </div>

        <div class="stats-grid">

            <div class="stat-box">

                <div class="stat-title">
                    BALANCE
                </div>

                <div class="stat-value" id="balance">
                    Loading...
                </div>

            </div>

            <div class="stat-box">

                <div class="stat-title">
                    LIVE P/L
                </div>

                <div class="stat-value green" id="livePL">
                    +$0.00
                </div>

            </div>

            <div class="stat-box">

                <div class="stat-title">
                    TOTAL PROFIT
                </div>

                <div class="stat-value green" id="totalProfit">
                    +$0.00
                </div>

            </div>

            <div class="stat-box">

                <div class="stat-title">
                    ACTIVE TRADES
                </div>

                <div class="stat-value" id="activeTrades">
                    0
                </div>

            </div>

        </div>

        <!-- CHART -->

        <div class="chart-box">

            <div class="chart-title">
                Live Bot Activity
            </div>

            <canvas id="chart"></canvas>

        </div>

        <!-- CONTROLS -->

        <div class="controls">

            <button class="control-btn start-btn" onclick="startBot()">
                START BOT
            </button>

            <button class="control-btn pause-btn" onclick="pauseBot()">
                PAUSE BOT
            </button>

            <button class="control-btn stop-btn" onclick="stopBot()">
                STOP BOT
            </button>

        </div>

        <!-- TRADE LOG -->

        <div class="trade-log">

            <h3>
                Live Trade Activity
            </h3>

            <div id="tradeLog"></div>

        </div>

    </div>

</div>

<script>

/* SUPABASE */

const supabaseUrl =
'https://grcpnibpjcpjckognvbm.supabase.co';

const supabaseKey =
'sb_publishable_QOfEf0mxWde9MH4ELMBMEw_frEjjb5K';

const { createClient } = supabase;

const client =
createClient(supabaseUrl,supabaseKey);

/* BOT DATA */

let balance = 0;
let totalProfit = 0;
let livePL = 0;
let activeTrades = 0;

let running = false;

/* ELEMENTS */

const balanceEl =
document.getElementById('balance');

const livePLEl =
document.getElementById('livePL');

const totalProfitEl =
document.getElementById('totalProfit');

const activeTradesEl =
document.getElementById('activeTrades');

const statusEl =
document.getElementById('botStatus');

const tradeLog =
document.getElementById('tradeLog');

/* LOAD USER ACCOUNT */

async function loadBalance(){

    try{

        const {
            data:{ session }
        } = await client.auth.getSession();

        if(!session){

            balanceEl.innerText =
            "$0.00";

            return;

        }

        const user =
        session.user;

        const {
            data
        } = await client
        .from('profiles')
        .select('*')
        .eq('id',user.id)
        .maybeSingle();

        if(data){

            balance =
            Number(data.balance || 0);

        }

        updateUI();

    }

    catch(err){

        console.log(err);

    }

}

/* BINANCE STYLE CHART */

const canvas =
document.getElementById('chart');

const ctx =
canvas.getContext('2d');

function resizeCanvas(){

    canvas.width =
    canvas.offsetWidth;

    canvas.height = 320;

}

resizeCanvas();

window.addEventListener(
'resize',
resizeCanvas
);

let candles = [];

let currentPrice = 100;

for(let i = 0; i < 45; i++){

    let open = currentPrice;

    let close =
    open + (Math.random() - 0.5) * 12;

    let high =
    Math.max(open, close) +
    Math.random() * 6;

    let low =
    Math.min(open, close) -
    Math.random() * 6;

    candles.push({
        open,
        close,
        high,
        low
    });

    currentPrice = close;

}

function drawChart(){

    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
    );

    ctx.strokeStyle =
    'rgba(255,255,255,0.05)';

    ctx.lineWidth = 1;

    for(let i = 0; i < 6; i++){

        let y =
        (canvas.height / 6) * i;

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(canvas.width, y);

        ctx.stroke();

    }

    let highs =
    candles.map(c => c.high);

    let lows =
    candles.map(c => c.low);

    let maxPrice =
    Math.max(...highs);

    let minPrice =
    Math.min(...lows);

    let padding = 20;

    let chartHeight =
    canvas.height - padding * 2;

    let candleWidth =
    canvas.width / candles.length;

    candles.forEach((candle, i) => {

        let x =
        i * candleWidth +
        candleWidth / 2;

        let openY =
        padding +
        ((maxPrice - candle.open) /
        (maxPrice - minPrice)) *
        chartHeight;

        let closeY =
        padding +
        ((maxPrice - candle.close) /
        (maxPrice - minPrice)) *
        chartHeight;

        let highY =
        padding +
        ((maxPrice - candle.high) /
        (maxPrice - minPrice)) *
        chartHeight;

        let lowY =
        padding +
        ((maxPrice - candle.low) /
        (maxPrice - minPrice)) *
        chartHeight;

        let bullish =
        candle.close > candle.open;

        let color =
        bullish
        ? '#00ff88'
        : '#ff4d4d';

        ctx.beginPath();

        ctx.strokeStyle = color;

        ctx.lineWidth = 2;

        ctx.moveTo(x, highY);

        ctx.lineTo(x, lowY);

        ctx.stroke();

        let bodyTop =
        Math.min(openY, closeY);

        let bodyHeight =
        Math.abs(openY - closeY);

        if(bodyHeight < 4){

            bodyHeight = 4;

        }

        ctx.fillStyle = color;

        ctx.fillRect(
            x - candleWidth * 0.25,
            bodyTop,
            candleWidth * 0.5,
            bodyHeight
        );

    });

}

function updateCandles(){

    if(!running) return;

    let lastClose =
    candles[candles.length - 1].close;

    let open =
    lastClose;

    let move =
    (Math.random() - 0.48) * 14;

    let close =
    open + move;

    let high =
    Math.max(open, close) +
    Math.random() * 5;

    let low =
    Math.min(open, close) -
    Math.random() * 5;

    candles.push({
        open,
        close,
        high,
        low
    });

    if(candles.length > 45){

        candles.shift();

    }

    drawChart();

}

/* UPDATE UI */

function updateUI(){

    balanceEl.innerText =
    '$' + balance.toFixed(2);

    totalProfitEl.innerText =
    (totalProfit >= 0 ? '+' : '-') +
    '$' +
    Math.abs(totalProfit).toFixed(2);

    livePLEl.innerText =
    (livePL >= 0 ? '+' : '-') +
    '$' +
    Math.abs(livePL).toFixed(2);

    livePLEl.className =
    'stat-value ' +
    (livePL >= 0 ? 'green' : 'red');

    totalProfitEl.className =
    'stat-value ' +
    (totalProfit >= 0 ? 'green' : 'red');

    activeTradesEl.innerText =
    activeTrades;

}

/* TRADE LOG */

function addTradeLog(profit){

    const div =
    document.createElement('div');

    div.className = 'log-item';

    const pairList = [
        'XAUUSD',
        'BTCUSD',
        'EURUSD',
        'GBPUSD',
        'ETHUSD'
    ];

    const pair =
    pairList[
    Math.floor(Math.random()*pairList.length)
    ];

    const type =
    Math.random() > 0.5
    ? 'BUY'
    : 'SELL';

    div.innerHTML = `
        <span>${type} ${pair}</span>
        <span style="
        color:${profit >= 0 ? '#00ff88' : '#ff4d4d'};
        font-weight:700;
        ">
        ${profit >= 0 ? '+' : '-'}$${Math.abs(profit).toFixed(2)}
        </span>
    `;

    tradeLog.prepend(div);

    if(tradeLog.children.length > 10){

        tradeLog.removeChild(
        tradeLog.lastChild);

    }

}

/* SAVE BALANCE */

async function saveBalance(){

    const {
        data:{ session }
    } = await client.auth.getSession();

    if(!session) return;

    await client
    .from('profiles')
    .update({
        balance:balance
    })
    .eq('id',session.user.id);

}

/* BOT ENGINE */

function botLoop(){

    if(!running) return;

    let trade;

    if(Math.random() > 0.2){

        trade =
        Math.random()*40;

    }

    else{

        trade =
        -(Math.random()*20);

    }

    balance += trade;

    totalProfit += trade;

    livePL = trade;

    activeTrades =
    Math.floor(Math.random()*4)+1;

    updateCandles();

    updateUI();

    addTradeLog(trade);

    saveBalance();

}

/* START */

function startBot(){

    running = true;

    statusEl.innerText =
    'RUNNING';

    statusEl.className =
    'status running';

}

/* PAUSE */

function pauseBot(){

    running = false;

    statusEl.innerText =
    'PAUSED';

    statusEl.className =
    'status paused';

}

/* STOP */

function stopBot(){

    running = false;

    statusEl.innerText =
    'STOPPED';

    statusEl.className =
    'status stopped';

    livePL = 0;

    activeTrades = 0;

    updateUI();

}

/* START */

drawChart();

updateUI();

loadBalance();

setInterval(botLoop,3000);

</script>

</body>
</html>
