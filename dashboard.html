<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top right,#13203f 0%,#050816 40%),
    #050816;
    color:white;
    display:flex;
    overflow-x:hidden;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#00f7ff;
    border-radius:20px;
}

/* SIDEBAR */

.sidebar{
    width:270px;
    height:100vh;
    background:rgba(13,19,39,0.88);
    backdrop-filter:blur(20px);
    padding:30px 20px;
    position:fixed;
    left:0;
    top:0;
    border-right:1px solid rgba(255,255,255,0.08);
    overflow-y:auto;
    transition:0.3s;
    z-index:1000;
    box-shadow:
    0 0 40px rgba(0,247,255,0.05);
}

.logo{
    font-size:32px;
    font-weight:700;
    color:#00f7ff;
    margin-bottom:45px;
    text-shadow:0 0 20px rgba(0,247,255,0.5);
}

.menu{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.menu-title{
    color:#7f8db3;
    font-size:13px;
    margin-bottom:5px;
    margin-top:15px;
    padding-left:5px;
    letter-spacing:1px;
}

.menu a{
    text-decoration:none;
    color:white;
    padding:16px;
    border-radius:16px;
    transition:0.3s ease;
    background:rgba(255,255,255,0.03);
    font-weight:500;
    border:1px solid transparent;
}

.menu a:hover{
    background:linear-gradient(90deg,#00f7ff,#00c3ff);
    color:black;
    transform:translateX(5px);
    box-shadow:0 0 25px rgba(0,247,255,0.35);
}

/* MAIN */

.main{
    margin-left:270px;
    width:calc(100% - 270px);
    padding:35px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
    gap:20px;
}

.topbar h1{
    font-size:36px;
    font-weight:700;
}

.profile{
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(15px);
    padding:14px 24px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
    0 0 20px rgba(0,247,255,0.08);
}

/* MOBILE MENU */

.menu-toggle{
    display:none;
    width:50px;
    height:50px;
    border:none;
    border-radius:14px;
    background:#111936;
    color:#00f7ff;
    font-size:24px;
    cursor:pointer;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    top:0;
    left:0;
    z-index:900;
    display:none;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:24px;
    margin-bottom:45px;
}

.card{
    background:
    linear-gradient(145deg,
    rgba(17,25,54,0.95),
    rgba(13,19,39,0.95));
    padding:28px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.06);
    transition:0.35s ease;
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(20px);
}

.card::before{
    content:'';
    position:absolute;
    width:150px;
    height:150px;
    background:rgba(0,247,255,0.06);
    border-radius:50%;
    top:-60px;
    right:-60px;
}

.card:hover{
    transform:translateY(-8px);
    border-color:#00f7ff;
    box-shadow:
    0 0 35px rgba(0,247,255,0.15);
}

.card h3{
    color:#8ea2d6;
    margin-bottom:12px;
    font-size:15px;
    font-weight:500;
}

.card h2{
    font-size:34px;
    font-weight:700;
    color:#ffffff;
}

/* SECTION */

.section-title{
    font-size:30px;
    margin-bottom:25px;
    font-weight:700;
}

/* BOT GRID */

.bot-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.bot-card{
    background:
    linear-gradient(145deg,
    rgba(17,25,54,0.96),
    rgba(13,19,39,0.96));
    padding:30px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.06);
    transition:0.35s ease;
    backdrop-filter:blur(20px);
    position:relative;
    overflow:hidden;
}

.bot-card::before{
    content:'';
    position:absolute;
    width:180px;
    height:180px;
    background:rgba(0,247,255,0.04);
    border-radius:50%;
    top:-80px;
    right:-80px;
}

.bot-card:hover{
    transform:translateY(-8px);
    border-color:#00f7ff;
    box-shadow:
    0 0 35px rgba(0,247,255,0.15);
}

.bot-card h3{
    margin-bottom:18px;
    font-size:28px;
}

.bot-card p{
    color:#9fb0d7;
    margin-bottom:22px;
    line-height:1.7;
}

.stats{
    margin-bottom:24px;
}

.stats div{
    margin-bottom:12px;
    color:#d7e3ff;
}

/* BUTTONS */

.activate-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(90deg,#00f7ff,#00c3ff);
    color:black;
    font-weight:700;
    cursor:pointer;
    transition:0.3s ease;
    font-size:15px;
}

.activate-btn:hover{
    transform:translateY(-3px);
    box-shadow:
    0 0 25px rgba(0,247,255,0.35);
}

/* TABLES */

.transactions{
    margin-top:45px;
    background:
    linear-gradient(145deg,
    rgba(17,25,54,0.95),
    rgba(13,19,39,0.95));
    padding:30px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.06);
    overflow-x:auto;
    backdrop-filter:blur(20px);
}

.transactions h2{
    margin-bottom:20px;
    font-size:28px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    min-width:600px;
}

table th{
    text-align:left;
    padding:18px;
    background:rgba(255,255,255,0.04);
    color:#00f7ff;
    font-weight:600;
}

table td{
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    color:#d8e2ff;
}

table tr:hover{
    background:rgba(255,255,255,0.03);
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
    left:-100%;
}

.sidebar.active{
    left:0;
}

.overlay.active{
    display:block;
}

.main{
    margin-left:0;
    width:100%;
    padding:20px;
}

.menu-toggle{
    display:block;
}

.topbar h1{
    font-size:26px;
}

.cards{
    grid-template-columns:1fr;
}

.bot-grid{
    grid-template-columns:1fr;
}

}

</style>
