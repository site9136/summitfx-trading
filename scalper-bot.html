<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scalper AI - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    padding:40px;
}

.container{
    max-width:800px;
    margin:auto;
    background:#0d1327;
    padding:40px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
}

h1{
    font-size:40px;
    margin-bottom:20px;
}

.description{
    color:#b5b5b5;
    line-height:1.8;
    margin-bottom:30px;
}

.stats{
    margin-bottom:30px;
}

.stats div{
    margin-bottom:15px;
    font-size:18px;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    background:#00f7ff;
    color:black;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:15px;
    transition:0.3s;
}

button:hover{
    opacity:0.8;
}

.message{
    margin-top:20px;
    background:#111936;
    padding:18px;
    border-radius:12px;
    display:none;
    color:#ffcc00;
    border:1px solid rgba(255,255,255,0.08);
}

.success{
    color:#00ff88;
}

.back-btn{
    display:inline-block;
    margin-top:25px;
    color:#00f7ff;
    text-decoration:none;
}

.dashboard-btn{
    display:none;
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    background:#00ff88;
    color:black;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    transition:0.3s;
}

.dashboard-btn:hover{
    opacity:0.8;
}

/* MOBILE */

@media(max-width:700px){

body{
    padding:20px;
}

.container{
    padding:25px;
}

h1{
    font-size:32px;
}

.stats div{
    font-size:16px;
}

}

</style>
</head>
<body>

<div class="container">

    <h1>Scalper AI</h1>

    <div class="description">
        Scalper AI is a high-frequency forex trading
        automation system designed to capture small
        market movements and generate consistent
        trading opportunities using advanced AI logic.
    </div>

    <div class="stats">
        <div>Minimum Activation: $500</div>
        <div>ROI: 18%</div>
        <div>Risk Level: Medium</div>
        <div>Win Rate: 89%</div>
    </div>

    <button onclick="activateBot()" id="activateBtn">
        Activate Bot
    </button>

    <!-- FIXED BUTTON -->
    <a href="scalper-ai.html" class="dashboard-btn" id="dashboardBtn">
        Open Bot Dashboard
    </a>

    <div class="message" id="message"></div>

    <a href="bots.html" class="back-btn">
        ← Back to Bots
    </a>

</div>

<script>

/* SUPABASE */

const supabaseUrl =
'https://grcpnibpjcpjckognvbm.supabase.co';

const supabaseKey =
'sb_publishable_QOfEf0mxWde9MH4ELMBMEw_frEjjb5K';

const { createClient } = supabase;

const client =
createClient(supabaseUrl,supabaseKey);

/* ACTIVATE BOT */

async function activateBot(){

    const message =
    document.getElementById("message");

    const dashboardBtn =
    document.getElementById("dashboardBtn");

    const activateBtn =
    document.getElementById("activateBtn");

    message.style.display = "block";

    /* GET USER */

    const {
        data:{ user }
    } = await client.auth.getUser();

    if(!user){

        message.innerHTML =
        "Please login first.";

        return;

    }

    /* GET PROFILE */

    const {
        data,
        error
    } = await client
    .from('profiles')
    .select('*')
    .eq('id',user.id)
    .single();

    if(error){

        message.innerHTML =
        "Failed to load account.";

        console.log(error);

        return;

    }

    const balance =
    Number(data.balance || 0);

    /* CHECK BALANCE */

    if(balance < 500){

        message.classList.remove("success");

        message.innerHTML =
        "Insufficient funds. Please deposit at least $500 to activate this bot.";

        dashboardBtn.style.display =
        "none";

        return;

    }

    /* SAVE BOT STATUS */

    const {
        error:updateError
    } = await client
    .from('profiles')
    .update({
        scalper_ai_active:true
    })
    .eq('id',user.id);

    if(updateError){

        message.classList.remove("success");

        message.innerHTML =
        "Failed to activate bot.";

        console.log(updateError);

        return;

    }

    /* SUCCESS */

    message.classList.add("success");

    message.innerHTML =
    "Scalper AI activated successfully.";

    dashboardBtn.style.display =
    "block";

    activateBtn.innerText =
    "Bot Activated";

    activateBtn.disabled = true;

    activateBtn.style.opacity =
    "0.7";

}

/* SHOW DASHBOARD BUTTON IF ALREADY ACTIVATED */

async function checkBotStatus(){

    const {
        data:{ user }
    } = await client.auth.getUser();

    if(!user) return;

    const {
        data
    } = await client
    .from('profiles')
    .select('scalper_ai_active')
    .eq('id',user.id)
    .single();

    if(data && data.scalper_ai_active){

        document.getElementById("dashboardBtn").style.display =
        "block";

        document.getElementById("activateBtn").innerText =
        "Bot Activated";

        document.getElementById("activateBtn").disabled =
        true;

        document.getElementById("activateBtn").style.opacity =
        "0.7";

    }

}

checkBotStatus();

</script>

</body>
</html>
