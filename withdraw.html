<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    height:100vh;
    background:#0b1020;
    padding:30px 20px;
    position:fixed;
    left:0;
    top:0;
    border-right:1px solid rgba(255,255,255,0.1);
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#00f7ff;
    margin-bottom:50px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu a{
    text-decoration:none;
    color:white;
    padding:15px;
    border-radius:12px;
    transition:0.3s;
    background:#111936;
}

.menu a:hover{
    background:#00f7ff;
    color:black;
}

/* MAIN */

.main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:30px;
}

.page-title{
    font-size:32px;
    margin-bottom:30px;
}

/* WITHDRAW BOX */

.withdraw-box{
    background:#0d1327;
    padding:35px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
    max-width:700px;
}

.withdraw-box h2{
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:10px;
}

.input-group input,
.input-group select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#111936;
    color:white;
    font-size:15px;
}

.notice-box{
    background:#111936;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
    margin-bottom:25px;
    color:#b5b5b5;
    line-height:1.7;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#00f7ff;
    color:black;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.8;
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
    width:100%;
    height:auto;
    position:relative;
}

.main{
    margin-left:0;
    width:100%;
}

body{
    flex-direction:column;
}

}

</style>
</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">SummitFX</div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="deposit.html">Deposit</a>
        <a href="withdraw.html">Withdraw</a>
        <a href="#">Trading Bots</a>
        <a href="#">Transactions</a>
        <a href="#">Settings</a>
        <a href="index.html">Logout</a>
    </div>

</div>

<!-- MAIN -->

<div class="main">

    <h1 class="page-title">Withdraw Funds</h1>

    <div class="withdraw-box">

        <h2>Request Withdrawal</h2>

        <div class="input-group">
            <label>Select Cryptocurrency</label>

            <select>
                <option>USDT TRC20</option>
                <option>Bitcoin (BTC)</option>
                <option>Ethereum (ETH)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Withdrawal Amount</label>

            <input type="number" placeholder="Enter amount">
        </div>

        <div class="input-group">
            <label>Wallet Address</label>

            <input type="text" placeholder="Enter wallet address">
        </div>

        <div class="notice-box">
            Withdrawals are reviewed manually by the admin team.
            Please double-check your wallet address before submitting.
        </div>

        <button>
            Submit Withdrawal Request
        </button>

    </div>

</div>

</body>
</html>
