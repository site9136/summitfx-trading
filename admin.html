<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    height:100vh;
    background:#0d1327;
    position:fixed;
    left:0;
    top:0;
    padding:30px 20px;
    border-right:1px solid rgba(255,255,255,0.08);
}

.logo{
    font-size:30px;
    font-weight:700;
    color:#00f7ff;
    margin-bottom:50px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu a{
    text-decoration:none;
    color:white;
    background:#111936;
    padding:15px;
    border-radius:12px;
    transition:0.3s;
}

.menu a:hover{
    background:#00f7ff;
    color:black;
}

/* MAIN */

.main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:30px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h1{
    font-size:34px;
}

.admin-badge{
    background:#111936;
    padding:12px 20px;
    border-radius:12px;
    color:#00f7ff;
}

/* STATS */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.card{
    background:#0d1327;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
}

.card h3{
    color:#b5b5b5;
    margin-bottom:12px;
    font-size:16px;
}

.card h2{
    font-size:32px;
}

/* TABLE */

.table-box{
    background:#0d1327;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
}

.table-box h2{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:#111936;
    padding:15px;
    text-align:left;
}

table td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.action-btn{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#00f7ff;
    color:black;
    font-weight:600;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){

body{
    flex-direction:column;
}

.sidebar{
    position:relative;
    width:100%;
    height:auto;
}

.main{
    margin-left:0;
    width:100%;
}

}

</style>
</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">SummitFX</div>

    <div class="menu">
        <a href="#">Dashboard</a>
        <a href="#">Users</a>
        <a href="#">Deposits</a>
        <a href="#">Withdrawals</a>
        <a href="#">Bots</a>
        <a href="#">Transactions</a>
        <a href="index.html">Logout</a>
    </div>

</div>

<!-- MAIN -->

<div class="main">

    <div class="topbar">

        <h1>Admin Dashboard</h1>

        <div class="admin-badge">
            Administrator
        </div>

    </div>

    <!-- STATS -->

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <h2>0</h2>
        </div>

        <div class="card">
            <h3>Total Deposits</h3>
            <h2>$0</h2>
        </div>

        <div class="card">
            <h3>Total Withdrawals</h3>
            <h2>$0</h2>
        </div>

        <div class="card">
            <h3>Active Bots</h3>
            <h2>0</h2>
        </div>

    </div>

    <!-- USERS TABLE -->

    <div class="table-box">

        <h2>Recent Users</h2>

        <table>

            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            <tr>
                <td>No users yet</td>
                <td>---</td>
                <td>---</td>
                <td>
                    <button class="action-btn">
                        View
                    </button>
                </td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
