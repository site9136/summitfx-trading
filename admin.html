<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    height:100vh;
    background:#0d1327;
    position:fixed;
    left:0;
    top:0;
    padding:30px 20px;
    border-right:1px solid rgba(255,255,255,0.08);
    overflow-y:auto;
}

.logo{
    font-size:30px;
    font-weight:700;
    color:#00f7ff;
    margin-bottom:50px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu a{
    text-decoration:none;
    color:white;
    background:#111936;
    padding:15px;
    border-radius:12px;
    transition:0.3s;
}

.menu a:hover{
    background:#00f7ff;
    color:black;
}

/* MAIN */

.main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:30px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    gap:20px;
}

.topbar h1{
    font-size:34px;
}

.admin-badge{
    background:#111936;
    padding:12px 20px;
    border-radius:12px;
    color:#00f7ff;
}

/* STATS */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.card{
    background:#0d1327;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
}

.card h3{
    color:#b5b5b5;
    margin-bottom:12px;
    font-size:16px;
}

.card h2{
    font-size:32px;
}

/* TABLE */

.table-box{
    background:#0d1327;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
    overflow-x:auto;
}

.table-box h2{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

table th{
    background:#111936;
    padding:15px;
    text-align:left;
}

table td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.action-btn{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#00f7ff;
    color:black;
    font-weight:600;
    cursor:pointer;
    margin-right:8px;
    margin-top:5px;
    transition:0.3s;
}

.action-btn:hover{
    opacity:0.8;
}

/* MOBILE */

@media(max-width:900px){

body{
    flex-direction:column;
}

.sidebar{
    position:relative;
    width:100%;
    height:auto;
}

.main{
    margin-left:0;
    width:100%;
    padding:20px;
}

.topbar{
    flex-direction:column;
    align-items:flex-start;
}

}

</style>
</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">SummitFX</div>

    <div class="menu">
        <a href="#">Dashboard</a>
        <a href="#">Users</a>
        <a href="#">Deposits</a>
        <a href="#">Withdrawals</a>
        <a href="#">Bots</a>
        <a href="#">Transactions</a>
        <a href="#" id="logoutBtn">Logout</a>
    </div>

</div>

<!-- MAIN -->

<div class="main">

    <div class="topbar">

        <h1>Admin Dashboard</h1>

        <div class="admin-badge">
            Administrator
        </div>

    </div>

    <!-- STATS -->

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <h2 id="totalUsers">0</h2>
        </div>

        <div class="card">
            <h3>Total Deposits</h3>
            <h2>$0</h2>
        </div>

        <div class="card">
            <h3>Total Withdrawals</h3>
            <h2>$0</h2>
        </div>

        <div class="card">
            <h3>Active Bots</h3>
            <h2>0</h2>
        </div>

    </div>

    <!-- USERS TABLE -->

    <div class="table-box">

        <h2>Recent Users</h2>

        <table>

            <thead>

            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Balance</th>
                <th>Role</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody id="usersTable">

            <tr>
                <td colspan="5" style="text-align:center;">
                    Loading users...
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

const supabaseUrl = 'https://grcpnibpjcpjckognvbm.supabase.co';

const supabaseKey = 'sb_publishable_QOfEf0mxWde9MH4ELMBMEw_frEjjb5K';

const { createClient } = supabase;

const client = createClient(supabaseUrl, supabaseKey);

/* ADMIN PROTECTION */

async function checkAdmin(){

    const { data: { user } } =
    await client.auth.getUser();

    if(!user){

        window.location.href = "login.html";
        return;

    }

    const { data, error } = await client
    .from('users')
    .select('*')
    .eq('id', user.id)
    .single();

    if(error || !data || data.role !== 'admin'){

        window.location.href = "dashboard.html";
        return;

    }

    loadUsers();

}

/* LOAD USERS */

async function loadUsers(){

    const { data, error } = await client
    .from('users')
    .select('*');

    const usersTable =
    document.getElementById('usersTable');

    const totalUsers =
    document.getElementById('totalUsers');

    if(error){

        usersTable.innerHTML = `
        <tr>
            <td colspan="5" style="text-align:center;">
                Failed to load users
            </td>
        </tr>
        `;

        return;
    }

    totalUsers.innerText = data.length;

    usersTable.innerHTML = '';

    if(data.length === 0){

        usersTable.innerHTML = `
        <tr>
            <td colspan="5" style="text-align:center;">
                No users found
            </td>
        </tr>
        `;

        return;
    }

    data.forEach(user => {

        usersTable.innerHTML += `

        <tr>

            <td>${user.full_name || 'N/A'}</td>

            <td>${user.email || 'N/A'}</td>

            <td>$${user.balance || 0}</td>

            <td>${user.role || 'user'}</td>

            <td>

                <button class="action-btn"
                onclick="creditUser('${user.id}', ${user.balance || 0})">

                    Credit

                </button>

                <button class="action-btn"
                onclick="deductUser('${user.id}', ${user.balance || 0})">

                    Deduct

                </button>

            </td>

        </tr>

        `;

    });

}

/* CREDIT USER */

async function creditUser(userId, currentBalance){

    const amount =
    prompt("Enter amount to credit:");

    if(!amount) return;

    const newBalance =
    Number(currentBalance) + Number(amount);

    const { error } = await client
    .from('users')
    .update({

        balance: newBalance

    })
    .eq('id', userId);

    if(error){

        alert("Failed to credit user");

    }else{

        alert("Balance credited successfully");

        loadUsers();

    }

}

/* DEDUCT USER */

async function deductUser(userId, currentBalance){

    const amount =
    prompt("Enter amount to deduct:");

    if(!amount) return;

    const newBalance =
    Number(currentBalance) - Number(amount);

    if(newBalance < 0){

        alert("Insufficient balance");
        return;

    }

    const { error } = await client
    .from('users')
    .update({

        balance: newBalance

    })
    .eq('id', userId);

    if(error){

        alert("Failed to deduct balance");

    }else{

        alert("Balance deducted successfully");

        loadUsers();

    }

}

/* LOGOUT */

document.getElementById('logoutBtn')
.addEventListener('click', async () => {

    await client.auth.signOut();

    window.location.href = "login.html";

});

/* START */

checkAdmin();

</script>

</body>
</html>
