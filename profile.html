<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:15px;
}

.topbar h1{
    font-size:34px;
}

.back-btn{
    text-decoration:none;
    background:#111936;
    color:#00f7ff;
    padding:12px 20px;
    border-radius:12px;
    transition:0.3s;
}

.back-btn:hover{
    background:#00f7ff;
    color:black;
}

.profile-box{
    background:#0d1327;
    padding:35px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.08);
}

.profile-header{
    text-align:center;
    margin-bottom:40px;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    background:#111936;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:40px;
    font-weight:700;
    color:#00f7ff;
    border:3px solid #00f7ff;
}

.profile-header h2{
    margin-top:20px;
    font-size:28px;
}

.profile-header p{
    color:#b5b5b5;
    margin-top:8px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    margin-bottom:10px;
    color:#b5b5b5;
    font-size:14px;
}

.input-group input,
.input-group select,
.input-group textarea{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#111936;
    color:white;
    font-size:15px;
    resize:none;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus{
    outline:none;
    border:1px solid #00f7ff;
}

.full-width{
    grid-column:1 / -1;
}

.save-btn{
    margin-top:30px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#00f7ff;
    color:black;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.save-btn:hover{
    opacity:0.8;
}

/* MOBILE */

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

.profile-box{
    padding:25px;
}

.topbar h1{
    font-size:28px;
}

}

</style>
</head>
<body>

<div class="container">

    <!-- TOPBAR -->

    <div class="topbar">

        <h1>My Profile</h1>

        <a href="dashboard.html" class="back-btn">
            Back to Dashboard
        </a>

    </div>

    <!-- PROFILE BOX -->

    <div class="profile-box">

        <div class="profile-header">

            <div class="avatar">
                S
            </div>

            <h2>SummitFX Trader</h2>

            <p>Manage your personal account information</p>

        </div>

        <!-- FORM -->

        <form>

            <div class="form-grid">

                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" placeholder="Enter first name">
                </div>

                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" placeholder="Enter last name">
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter username">
                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Enter phone number">
                </div>

                <div class="input-group">
                    <label>Date of Birth</label>
                    <input type="date">
                </div>

                <div class="input-group">
                    <label>Gender</label>
                    <select>
                        <option>Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Country</label>
                    <select>
                        <option>Select Country</option>
                        <option>Kenya</option>
                        <option>United States</option>
                        <option>United Kingdom</option>
                        <option>Canada</option>
                        <option>South Africa</option>
                        <option>Nigeria</option>
                        <option>India</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter email">
                </div>

                <div class="input-group full-width">
                    <label>Bio</label>
                    <textarea rows="5" placeholder="Tell us about yourself"></textarea>
                </div>

                <div class="input-group full-width">
                    <label>Address</label>
                    <textarea rows="4" placeholder="Enter your address"></textarea>
                </div>

            </div>

            <button type="submit" class="save-btn">
                Save Profile
            </button>

        </form>

    </div>

</div>

</body>
</html>
