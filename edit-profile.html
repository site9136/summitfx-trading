<div class="profile-form">

    <!-- FIRST NAME -->

    <div class="input-group">
        <label>First Name</label>
        <input type="text"
        id="firstName"
        placeholder="Enter first name">
    </div>

    <!-- LAST NAME -->

    <div class="input-group">
        <label>Last Name</label>
        <input type="text"
        id="lastName"
        placeholder="Enter last name">
    </div>

    <!-- USERNAME -->

    <div class="input-group">
        <label>Username</label>
        <input type="text"
        id="username"
        placeholder="Enter username">
    </div>

    <!-- PHONE -->

    <div class="input-group">
        <label>Phone Number</label>
        <input type="tel"
        id="phone"
        placeholder="Enter phone number">
    </div>

    <!-- DATE OF BIRTH -->

    <div class="input-group">
        <label>Date of Birth</label>
        <input type="date"
        id="dob">
    </div>

    <!-- GENDER -->

    <div class="input-group">
        <label>Gender</label>

        <select id="gender">

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>
