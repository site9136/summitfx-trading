<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */

const supabaseUrl =
'https://grcpnibpjcpjckognvbm.supabase.co';

const supabaseKey =
'sb_publishable_QOfEf0mxWde9MH4ELMBMEw_frEjjb5K';

const { createClient } = supabase;

const client =
createClient(supabaseUrl, supabaseKey);

/* FORM */

const form =
document.querySelector(".profile-form");

/* LOAD USER PROFILE */

async function loadProfile(){

    const { data:{ user } } =
    await client.auth.getUser();

    if(!user){

        window.location.href = "login.html";
        return;

    }

    const { data, error } =
    await client
    .from('users')
    .select('*')
    .eq('id', user.id)
    .single();

    if(error){

        console.log(error);
        return;

    }

    if(data){

        document.getElementById("firstName").value =
        data.first_name || "";

        document.getElementById("lastName").value =
        data.last_name || "";

        document.getElementById("username").value =
        data.username || "";

        document.getElementById("phone").value =
        data.phone || "";

        document.getElementById("dob").value =
        data.dob || "";

        document.getElementById("gender").value =
        data.gender || "";

        document.getElementById("country").value =
        data.country || "";

        document.getElementById("email").value =
        data.email || "";

    }

}

/* SAVE PROFILE */

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const saveBtn =
    document.querySelector(".save-btn");

    saveBtn.innerText = "Saving...";

    const { data:{ user } } =
    await client.auth.getUser();

    const updates = {

        first_name:
        document.getElementById("firstName").value,

        last_name:
        document.getElementById("lastName").value,

        username:
        document.getElementById("username").value,

        phone:
        document.getElementById("phone").value,

        dob:
        document.getElementById("dob").value,

        gender:
        document.getElementById("gender").value,

        country:
        document.getElementById("country").value,

        email:
        document.getElementById("email").value

    };

    const { error } =
    await client
    .from('users')
    .update(updates)
    .eq('id', user.id);

    if(error){

        alert(error.message);

        saveBtn.innerText =
        "Save Profile Changes";

        return;

    }

    alert("Profile updated successfully");

    saveBtn.innerText =
    "Save Profile Changes";

});

/* START */

loadProfile();

</script>

</body>
</html>
