<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    padding:30px;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:auto;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
    flex-wrap:wrap;
    gap:15px;
}

.topbar h1{
    font-size:34px;
    font-weight:700;
}

.back-btn{
    text-decoration:none;
    background:#111936;
    color:#00f7ff;
    padding:14px 22px;
    border-radius:14px;
    transition:0.3s;
    font-weight:600;
}

.back-btn:hover{
    background:#00f7ff;
    color:black;
}

/* PROFILE FORM */

.profile-form{
    width:100%;
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
    background:linear-gradient(145deg,#0d1327,#111936);
    padding:40px;
    border-radius:28px;
    border:1px solid rgba(0,247,255,0.12);
    box-shadow:
    0 0 25px rgba(0,247,255,0.08),
    0 0 60px rgba(0,0,0,0.35);
}

/* INPUT GROUP */

.input-group{
    display:flex;
    flex-direction:column;
}

/* LABELS */

.input-group label{
    margin-bottom:10px;
    color:#00f7ff;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.5px;
}

/* INPUTS */

.input-group input,
.input-group select{
    width:100%;
    padding:18px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.08);
    background:linear-gradient(145deg,#111936,#182445);
    color:white;
    font-size:15px;
    transition:0.3s;
    outline:none;
}

/* PLACEHOLDER */

.input-group input::placeholder{
    color:#9ba6c7;
}

/* HOVER */

.input-group input:hover,
.input-group select:hover{
    border-color:rgba(0,247,255,0.4);
}

/* FOCUS */

.input-group input:focus,
.input-group select:focus{
    border-color:#00f7ff;
    box-shadow:0 0 15px rgba(0,247,255,0.3);
    transform:translateY(-2px);
}

/* OPTIONS */

.input-group select option{
    background:#0b1020;
    color:white;
}

/* SAVE BUTTON */

.save-btn{
    grid-column:1/-1;
    padding:18px;
    border:none;
    border-radius:18px;
    background:linear-gradient(90deg,#00f7ff,#00c3ff);
    color:black;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

.save-btn:hover{
    transform:translateY(-3px);
    opacity:0.9;
    box-shadow:0 0 20px rgba(0,247,255,0.35);
}

/* MOBILE */

@media(max-width:768px){

body{
    padding:20px;
}

.profile-form{
    grid-template-columns:1fr;
    padding:25px;
}

.topbar h1{
    font-size:28px;
}

}

</style>
</head>
<body>

<div class="container">

    <!-- TOPBAR -->

    <div class="topbar">

        <h1>Edit Profile</h1>

        <a href="dashboard.html" class="back-btn">
            Back to Dashboard
        </a>

    </div>

    <!-- PROFILE FORM -->

    <form class="profile-form">

        <!-- FIRST NAME -->

        <div class="input-group">
            <label>First Name</label>
            <input type="text"
            id="firstName"
            placeholder="Enter first name">
        </div>

        <!-- LAST NAME -->

        <div class="input-group">
            <label>Last Name</label>
            <input type="text"
            id="lastName"
            placeholder="Enter last name">
        </div>

        <!-- USERNAME -->

        <div class="input-group">
            <label>Username</label>
            <input type="text"
            id="username"
            placeholder="Enter username">
        </div>

        <!-- PHONE -->

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel"
            id="phone"
            placeholder="Enter phone number">
        </div>

        <!-- DATE OF BIRTH -->

        <div class="input-group">
            <label>Date of Birth</label>
            <input type="date"
            id="dob">
        </div>

        <!-- GENDER -->

        <div class="input-group">

            <label>Gender</label>

            <select id="gender">

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>

        <!-- COUNTRY -->

        <div class="input-group">

            <label>Country</label>

            <select id="country">

                <option value="">
                    Select Country
                </option>

                <option>Kenya</option>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
                <option>South Africa</option>
                <option>Nigeria</option>
                <option>India</option>
                <option>Australia</option>
                <option>Germany</option>
                <option>France</option>

            </select>

        </div>

        <!-- EMAIL -->

        <div class="input-group">
            <label>Email</label>
            <input type="email"
            id="email"
            placeholder="Enter email">
        </div>

        <!-- SAVE BUTTON -->

        <button type="submit" class="save-btn">
            Save Profile Changes
        </button>

    </form>

</div>

<script>

/* SUPABASE */

const supabaseUrl =
'https://grcpnibpjcpjckognvbm.supabase.co';

const supabaseKey =
'sb_publishable_QOfEf0mxWde9MH4ELMBMEw_frEjjb5K';

const { createClient } = supabase;

const client =
createClient(supabaseUrl, supabaseKey);

/* FORM */

const form =
document.querySelector(".profile-form");

/* LOAD USER PROFILE */

async function loadProfile(){

    const { data:{ user } } =
    await client.auth.getUser();

    if(!user){

        window.location.href = "login.html";
        return;

    }

    const { data, error } =
    await client
    .from('users')
    .select('*')
    .eq('id', user.id)
    .single();

    if(error){

        console.log(error);
        return;

    }

    if(data){

        document.getElementById("firstName").value =
        data.first_name || "";

        document.getElementById("lastName").value =
        data.last_name || "";

        document.getElementById("username").value =
        data.username || "";

        document.getElementById("phone").value =
        data.phone || "";

        document.getElementById("dob").value =
        data.dob || "";

        document.getElementById("gender").value =
        data.gender || "";

        document.getElementById("country").value =
        data.country || "";

        document.getElementById("email").value =
        data.email || "";

    }

}

/* SAVE PROFILE */

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const saveBtn =
    document.querySelector(".save-btn");

    saveBtn.innerText = "Saving...";

    const { data:{ user } } =
    await client.auth.getUser();

    const updates = {

        first_name:
        document.getElementById("firstName").value,

        last_name:
        document.getElementById("lastName").value,

        username:
        document.getElementById("username").value,

        phone:
        document.getElementById("phone").value,

        dob:
        document.getElementById("dob").value,

        gender:
        document.getElementById("gender").value,

        country:
        document.getElementById("country").value,

        email:
        document.getElementById("email").value

    };

    const { error } =
    await client
    .from('users')
    .update(updates)
    .eq('id', user.id);

    if(error){

        alert(error.message);

        saveBtn.innerText =
        "Save Profile Changes";

        return;

    }

    alert("Profile updated successfully");

    saveBtn.innerText =
    "Save Profile Changes";

});

/* START */

loadProfile();

</script>

</body>
</html>
