<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    display:flex;
    overflow-x:hidden;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    height:100vh;
    background:#0b1020;
    padding:30px 20px;
    position:fixed;
    left:0;
    top:0;
    border-right:1px solid rgba(255,255,255,0.1);
    overflow-y:auto;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#00f7ff;
    margin-bottom:40px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu-title{
    color:#7f8db3;
    font-size:14px;
    margin-bottom:5px;
    margin-top:10px;
    padding-left:5px;
}

.menu a{
    text-decoration:none;
    color:white;
    padding:15px;
    border-radius:12px;
    transition:0.3s;
    background:#111936;
    font-weight:500;
}

.menu a:hover{
    background:#00f7ff;
    color:black;
}

/* MAIN */

.main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:30px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h1{
    font-size:32px;
}

.profile{
    background:#111936;
    padding:12px 20px;
    border-radius:12px;
}

/* TABLE */

.table-box{
    background:#0d1327;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

table th{
    text-align:left;
    padding:15px;
    background:#111936;
}

table td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.status{
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    display:inline-block;
}

.pending{
    background:#ffb02020;
    color:#ffb020;
}

.completed{
    background:#00ff9520;
    color:#00ff95;
}

.failed{
    background:#ff3b3b20;
    color:#ff4d4d;
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
    display:none;
}

.main{
    margin-left:0;
    width:100%;
    padding:20px;
}

.topbar{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
}

.topbar h1{
    font-size:26px;
}

}

</style>
</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">SummitFX</div>

    <div class="menu">

        <div class="menu-title">MAIN MENU</div>

        <a href="dashboard.html">Dashboard</a>

        <a href="deposit.html">Deposit</a>

        <a href="withdraw.html">Withdraw</a>

        <a href="bots.html">Trading Bots</a>

        <a href="plans.html">Investment Plans</a>

        <a href="transactions.html">Transactions</a>

        <div class="menu-title">ACCOUNT</div>

        <a href="profile.html">My Profile</a>

        <a href="edit-profile.html">Edit Profile</a>

        <a href="kyc.html">Verify KYC</a>

        <a href="settings.html">Settings</a>

        <a href="index.html">Logout</a>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <div class="topbar">

        <h1>Transaction History</h1>

        <div class="profile">
            Secure Records
        </div>

    </div>

    <!-- TRANSACTION TABLE -->

    <div class="table-box">

        <table>

            <thead>

            <tr>
                <th>Type</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Status</th>
                <th>Date</th>
            </tr>

            </thead>

            <tbody id="transactionTable">

            <tr>
                <td colspan="5"
                style="text-align:center;padding:30px;color:#b5b5b5;">
                    Loading transactions...
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

/* SUPABASE */

const supabaseUrl =
'https://grcpnibpjcpjckognvbm.supabase.co';

const supabaseKey =
'sb_publishable_QOfEf0mxWde9MH4ELMBMEw_frEjjb5K';

const { createClient } = supabase;

const client =
createClient(supabaseUrl,supabaseKey);

/* LOAD TRANSACTIONS */

async function loadTransactions(){

    const { data:{ user } } =
    await client.auth.getUser();

    if(!user){

        window.location.href = "login.html";
        return;

    }

    const transactionTable =
    document.getElementById('transactionTable');

    const { data, error } =
    await client
    .from('transactions')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at', { ascending:false });

    if(error){

        transactionTable.innerHTML = `
        <tr>
            <td colspan="5"
            style="text-align:center;padding:30px;color:red;">
                Failed to load transactions
            </td>
        </tr>
        `;

        return;
    }

    if(data.length === 0){

        transactionTable.innerHTML = `
        <tr>
            <td colspan="5"
            style="text-align:center;padding:30px;color:#b5b5b5;">
                No transactions found
            </td>
        </tr>
        `;

        return;
    }

    transactionTable.innerHTML = '';

    data.forEach(tx => {

        let statusClass = 'pending';

        if(tx.status === 'Completed'){
            statusClass = 'completed';
        }

        if(tx.status === 'Failed'){
            statusClass = 'failed';
        }

        transactionTable.innerHTML += `

        <tr>

            <td>${tx.type}</td>

            <td>$${Number(tx.amount).toFixed(2)}</td>

            <td>${tx.method}</td>

            <td>
                <span class="status ${statusClass}">
                    ${tx.status}
                </span>
            </td>

            <td>
                ${new Date(tx.created_at).toLocaleDateString()}
            </td>

        </tr>

        `;

    });

}

/* START */

loadTransactions();

</script>

</body>
</html>
