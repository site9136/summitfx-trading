<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:#0d1327;
    padding:40px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 30px rgba(0,247,255,0.08);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:700;
    color:#00f7ff;
    margin-bottom:10px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    font-size:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#d6d6d6;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#111936;
    color:white;
    font-size:15px;
    transition:0.3s;
}

.input-group input:focus{
    outline:none;
    border:1px solid #00f7ff;
    box-shadow:0 0 10px rgba(0,247,255,0.2);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00f7ff;
    color:black;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.85;
    transform:translateY(-2px);
}

.message{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    display:none;
    text-align:center;
    line-height:1.6;
    font-size:14px;
}

.success{
    background:rgba(0,255,140,0.1);
    color:#00ff99;
    border:1px solid rgba(0,255,140,0.2);
}

.error{
    background:rgba(255,0,0,0.1);
    color:#ff5c5c;
    border:1px solid rgba(255,0,0,0.2);
}

.bottom-text{
    text-align:center;
    margin-top:20px;
    color:#b5b5b5;
    font-size:14px;
}

.bottom-text a{
    color:#00f7ff;
    text-decoration:none;
    font-weight:500;
}

.bottom-text a:hover{
    text-decoration:underline;
}

/* MOBILE */

@media(max-width:500px){

.container{
    padding:30px 20px;
}

h1{
    font-size:26px;
}

.logo{
    font-size:28px;
}

}

</style>
</head>
<body>

<div class="container">

    <div class="logo">SummitFX</div>

    <h1>Create Account</h1>

    <form id="signupForm">

        <div class="input-group">
            <label>Full Name</label>
            <input 
            type="text" 
            id="fullname" 
            placeholder="Enter your full name" 
            required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input 
            type="email" 
            id="email" 
            placeholder="Enter your email" 
            required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input 
            type="password" 
            id="password" 
            placeholder="Create password" 
            required>
        </div>

        <button type="submit" id="signupBtn">
            Create Account
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="bottom-text">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

/* SUPABASE */

const supabaseUrl =
'https://grcpnibpjcpjckognvbm.supabase.co';

const supabaseKey =
'sb_publishable_QOfEf0mxWde9MH4ELMBMEw_frEjjb5K';

const { createClient } = supabase;

const client =
createClient(supabaseUrl, supabaseKey);

/* ELEMENTS */

const form =
document.getElementById('signupForm');

const messageBox =
document.getElementById('message');

const signupBtn =
document.getElementById('signupBtn');

/* SIGNUP */

form.addEventListener('submit', async (e) => {

    e.preventDefault();

    signupBtn.innerText = "Creating Account...";
    signupBtn.disabled = true;

    const fullname =
    document.getElementById('fullname').value.trim();

    const email =
    document.getElementById('email').value.trim();

    const password =
    document.getElementById('password').value;

    /* CREATE AUTH USER */

    const { data, error } =
    await client.auth.signUp({

        email: email,

        password: password,

        options: {

            data: {

                full_name: fullname

            },

            emailRedirectTo:
            'https://site9136.github.io/summitfx-trading/login.html'

        }

    });

    /* ERROR */

    if(error){

        messageBox.style.display = "block";

        messageBox.className = "message error";

        messageBox.innerText = error.message;

        signupBtn.innerText = "Create Account";
        signupBtn.disabled = false;

        return;

    }

    /* INSERT USER INTO DATABASE */

    const user = data.user;

    if(user){

        const { error: insertError } =
        await client
        .from('users')
        .insert([{

            id: user.id,

            full_name: fullname,

            email: email,

            balance: 0,

            total_profit: 0,

            total_withdrawals: 0,

            role: 'user',

            created_at: new Date().toISOString()

        }]);

        if(insertError){

            console.log(insertError);

        }

    }

    /* SUCCESS */

    messageBox.style.display = "block";

    messageBox.className = "message success";

    messageBox.innerText =
    "Account created successfully. Please check your email to verify your account before logging in.";

    signupBtn.innerText = "Account Created";

    form.reset();

});

</script>

</body>
</html>
