<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - SummitFX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:#0d1327;
    padding:40px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:700;
    color:#00f7ff;
    margin-bottom:10px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    font-size:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#111936;
    color:white;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border:1px solid #00f7ff;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00f7ff;
    color:black;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.8;
}

.message{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    display:none;
    text-align:center;
    line-height:1.6;
}

.success{
    background:rgba(0,255,140,0.1);
    color:#00ff99;
}

.error{
    background:rgba(255,0,0,0.1);
    color:#ff5c5c;
}

.bottom-text{
    text-align:center;
    margin-top:20px;
    color:#b5b5b5;
}

.bottom-text a{
    color:#00f7ff;
    text-decoration:none;
}

</style>
</head>
<body>

<div class="container">

    <div class="logo">SummitFX</div>

    <h1>Create Account</h1>

    <form id="signupForm">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Create password" required>
        </div>

        <button type="submit" id="signupBtn">
            Create Account
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="bottom-text">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

const supabaseUrl = 'https://grcpnibpjcpjckognvbm.supabase.co';

const supabaseKey = 'sb_publishable_QOfEf0mxWde9MH4ELMBMEw_frEjjb5K';

const { createClient } = supabase;

const client = createClient(supabaseUrl, supabaseKey);

const form = document.getElementById('signupForm');

const messageBox = document.getElementById('message');

const signupBtn = document.getElementById('signupBtn');

form.addEventListener('submit', async (e) => {

    e.preventDefault();

    signupBtn.innerText = "Creating Account...";

    const fullname = document.getElementById('fullname').value;

    const email = document.getElementById('email').value;

    const password = document.getElementById('password').value;

    const { data, error } = await client.auth.signUp({

        email: email,

        password: password,

        options: {

            data: {

                full_name: fullname

            },

            emailRedirectTo: 'https://site9136.github.io/summitfx-trading/login.html'

        }

    });

    if(error){

        messageBox.style.display = "block";

        messageBox.className = "message error";

        messageBox.innerText = error.message;

        signupBtn.innerText = "Create Account";

    }else{

        const user = data.user;

        if(user){

            await client.from('users').insert([{

                id: user.id,
                full_name: fullname,
                email: email,
                balance: 0,
                role: 'user'

            }]);

        }

        messageBox.style.display = "block";

        messageBox.className = "message success";

        messageBox.innerText =
        "Account created successfully. Check your email to verify your account.";

        signupBtn.innerText = "Account Created";

        form.reset();

    }

});

</script>

</body>
</html>
